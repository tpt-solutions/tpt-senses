# cargo-deny configuration. Run with: cargo deny check
#
# Licence policy (todo Phase 0, spec §41, DESIGN.md):
# - Dual-licensed crates such as "MIT OR Apache-2.0" are accepted via their MIT option.
# - Apache-2.0 *alone* is NOT on the allow list, so Apache-only dependencies are rejected.
# - GPL, LGPL, MPL, AGPL and unknown licences are rejected by omission.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93

# Crate-scoped licence exceptions. Each one is reviewed individually; the allow-list above is
# unchanged. minicbor and minicbor-serde are used by tpt-thought-core (pinned git dependency, see
# tpt-senses-thought) and are licensed under the Blue Oak Model License 1.0.0, an OSI-approved
# permissive licence.
[[licenses.exceptions]]
name = "minicbor"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
name = "minicbor-serde"
allow = ["BlueOak-1.0.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources are allowed only for the two pinned TPT repositories (todo Phase 6). Each pin is a
# full commit in its crate's Cargo.toml, and each repo is dual-licensed MIT OR Apache-2.0.
allow-git = [
    "https://github.com/tpt-solutions/tpt-thought",
    "https://github.com/tpt-solutions/tpt-anima",
]
