[package]
name = "tpt-senses"
description = "General-purpose sensory and perception foundation: measurements, observations, uncertainty and provenance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sensors", "perception", "observation", "fusion", "robotics"]
categories = ["no-std", "science::robotics"]

[features]
default = ["std"]
# Enables std integrations (std::error::Error impls). The core always requires `alloc`;
# an alloc-free subset is tracked separately (todo Phase 7, spec §51).
std = []
# Serialization of the observation model. Deserialization goes through the same validating
# constructors as in-memory code, so untrusted input cannot create invalid values.
serde = ["dep:serde"]
# CBOR encoding of the serde-enabled observation model (cbor4ii, MIT).
cbor = ["serde", "dep:cbor4ii"]


[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
futures-core = { version = "0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc", "rc"], optional = true }

cbor4ii = { version = "1.2", default-features = false, features = ["serde1"], optional = true }

[dev-dependencies]
serde_json = "1"
# Pinned to 0.7: criterion 0.8 needs Rust 1.86, above this crate's MSRV of 1.85.
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "streams"
harness = false
