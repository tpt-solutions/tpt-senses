[workspace]
resolver = "3"
members = [
    "crates/tpt-senses",
    "crates/tpt-senses-agri",
    "crates/tpt-senses-audio",
    "crates/tpt-senses-cv",
    "crates/tpt-senses-eve",
    "crates/tpt-senses-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
